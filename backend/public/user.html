<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Billing Perpus — PC User</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'></text></svg>" id="favicon">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<script src="/socket.io/socket.io.js"></script>
<script>
  if (typeof io === 'undefined') {
    document.write('<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"><\/script>');
  }
</script>

<style>
  :root{
    --bg-body: #0a0a0c;
    --bg-panel: #141418;
    --bg-sidebar: #101014;
    --bg-header: #101014;
    --bg-footer: #101014;
    --text-primary: #ffffff;
    --text-secondary: #a0a0ab;
    --text-muted: #5c5c66;
    --accent-green: #22c55e;
    --accent-green-glow: rgba(34, 197, 94, 0.3);
    --accent-red: #ef4444;
    --accent-gold: #f59e0b;
    --accent-blue: #3b82f6;
    --accent-violet: #8b5cf6;
    --border-color: rgba(255, 255, 255, 0.08);
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background-color: var(--bg-body); color: var(--text-primary);
    font-family: var(--font-body); overflow:hidden; -webkit-user-select:none; user-select:none;
    display: flex; flex-direction: column; height: 100vh;
  }

  .header {
    height: 60px; background: var(--bg-header); border-bottom: 1px solid var(--border-color);
    display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
    flex-shrink: 0; z-index: 10;
    user-select: none;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .logo-box {
    width: 34px; height: 34px; background: var(--accent-green); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 1.1rem; color: #000; font-family: var(--font-display);
    box-shadow: 0 0 12px var(--accent-green-glow);
  }
  .brand-text { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; color: var(--accent-green); letter-spacing: -0.3px; }
  .brand-sub { font-size: 0.65rem; color: var(--text-secondary); margin-top: 1px; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .status-badge {
    display: flex; align-items: center; gap: 5px; font-size: 0.7rem; font-weight: 600;
    padding: 4px 10px; border-radius: 16px;
    background: rgba(34, 197, 94, 0.1); color: var(--accent-green); border: 1px solid rgba(34, 197, 94, 0.2);
  }
  .status-badge.off { background: rgba(239, 68, 68, 0.1); color: var(--accent-red); border-color: rgba(239, 68, 68, 0.2); }
  .status-badge .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; }
  .clock-display { font-family: var(--font-mono); font-size: 0.9rem; font-weight: 600; color: var(--text-primary); }
  .date-display { font-size: 0.65rem; color: var(--text-secondary); text-align: right; }
  .main-body { flex: 1; display: flex; overflow: hidden; }
  .sidebar {
    width: 240px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color);
    display: flex; flex-direction: column; padding: 14px; gap: 10px; flex-shrink: 0; overflow-y: auto;
  }
  .panel-box {
    background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 10px;
    padding: 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .panel-title { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
  .info-row {
    display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem;
    padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .info-row:last-child { border-bottom: none; }
  .info-row .label { color: var(--text-secondary); }
  .info-row .value { font-family: var(--font-mono); font-weight: 600; color: var(--text-primary); }
  .info-row .value.highlight { color: var(--accent-green); }
  .main-content {
    flex: 1; background: var(--bg-body); display: flex; flex-direction: column;
    padding: 20px; gap: 16px; overflow: hidden; position: relative;
  }
  .main-bg-layer {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-size: cover; background-position: center; opacity: 0.05; z-index: 0; pointer-events: none;
  }
  .content-wrapper { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; gap: 16px; }
  .status-card {
    background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 16px;
    padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; flex: 1; box-shadow: 0 8px 24px rgba(0,0,0,0.4); position: relative; overflow: hidden;
  }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 16px; border-radius: 99px;
    font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    border: 1px solid transparent; margin-bottom: 16px;
  }
  .status-pill.available { background: rgba(34, 197, 94, 0.1); color: var(--accent-green); border-color: rgba(34, 197, 94, 0.2); }
  .status-pill.inuse { background: rgba(239, 68, 68, 0.1); color: var(--accent-red); border-color: rgba(239, 68, 68, 0.2); }
  .status-pill.paused { background: rgba(245, 158, 11, 0.1); color: var(--accent-gold); border-color: rgba(245, 158, 11, 0.2); }
  .status-pill.maintenance { background: rgba(139, 92, 246, 0.1); color: var(--accent-violet); border-color: rgba(139, 92, 246, 0.2); }
  .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }

  .timer-display {
    font-family: var(--font-mono);
    font-size: clamp(1.8rem, 4vw, 3rem);
    font-weight: 700;
    line-height: 1;
    color: var(--text-primary);
    letter-spacing: -1px;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.08);
    margin: 8px 0;
  }
  .timer-display.dim { color: var(--text-muted); text-shadow: none; }

  .headline { font-family: var(--font-display); font-size: 1.8rem; font-weight: 600; color: var(--text-primary); }
  .subline { color: var(--text-secondary); font-size: 0.9rem; max-width: 450px; margin-top: 8px; }
  .info-grid {
    display: flex; gap: 30px; justify-content: center; margin-top: 20px;
    background: rgba(0, 0, 0, 0.2); padding: 14px 28px; border-radius: 12px; border: 1px solid var(--border-color);
  }
  .info-item { text-align: center; }
  .info-item .lbl { color: var(--text-muted); font-size: 0.65rem; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
  .info-item .val { font-family: var(--font-mono); font-size: 1.1rem; font-weight: 600; color: var(--text-primary); margin-top: 3px; }
  .bottom-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .info-card {
    background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 10px;
    padding: 14px; display: flex; gap: 10px; align-items: flex-start;
  }
  .info-card .icon {
    width: 32px; height: 32px; border-radius: 8px; background: rgba(59, 130, 246, 0.1); color: var(--accent-blue);
    display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0;
  }
  .info-card .text h4 { margin: 0 0 3px 0; font-size: 0.8rem; color: var(--text-primary); }
  .info-card .text p { margin: 0; font-size: 0.7rem; color: var(--text-secondary); line-height: 1.4; }
  .footer {
    height: 45px; background: var(--bg-footer); border-top: 1px solid var(--border-color);
    display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
    flex-shrink: 0; font-size: 0.7rem; color: var(--text-secondary); z-index: 10;
  }
  .footer-left { display: flex; align-items: center; gap: 12px; }
  .footer-left span { color: var(--accent-green); font-weight: 600; }

  .force-modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(8px);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .force-modal-overlay.show { opacity: 1; pointer-events: auto; }
  .force-modal {
    background: var(--bg-panel);
    border: 2px solid var(--accent-green);
    border-radius: 20px;
    padding: 32px;
    max-width: 500px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 60px rgba(34, 197, 94, 0.4);
    animation: popIn 0.4s cubic-bezier(0.2, 0.9, 0.25, 1.1);
  }
  @keyframes popIn {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .force-modal.danger { border-color: var(--accent-red); box-shadow: 0 0 60px rgba(239, 68, 68, 0.4); }
  .force-modal.warn { border-color: var(--accent-gold); box-shadow: 0 0 60px rgba(245, 158, 11, 0.4); }
  .force-modal.info { border-color: var(--accent-violet); box-shadow: 0 0 60px rgba(139, 92, 246, 0.4); }
  .force-modal.success { border-color: var(--accent-green); box-shadow: 0 0 60px rgba(34, 197, 94, 0.4); }

  .force-modal .modal-icon {
    width: 70px; height: 70px; border-radius: 50%;
    background: rgba(34, 197, 94, 0.15);
    color: var(--accent-green);
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem;
    margin: 0 auto 20px;
    animation: pulse 1.5s infinite;
  }
  .force-modal.danger .modal-icon { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }
  .force-modal.warn .modal-icon { background: rgba(245, 158, 11, 0.15); color: var(--accent-gold); }
  .force-modal.info .modal-icon { background: rgba(139, 92, 246, 0.15); color: var(--accent-violet); }
  .force-modal.success .modal-icon { background: rgba(34, 197, 94, 0.15); color: var(--accent-green); }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  .force-modal .modal-title {
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 12px;
  }
  .force-modal .modal-message {
    font-size: 1rem;
    color: var(--text-secondary);
    line-height: 1.5;
    margin-bottom: 24px;
    white-space: pre-line;
  }
  .force-modal .modal-btn {
    background: var(--accent-green);
    color: #000;
    border: none;
    padding: 12px 32px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .force-modal .modal-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(34, 197, 94, 0.4);
  }

  .center-msg {
    height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: var(--text-secondary);
    padding: 24px;
  }
  .center-msg h1 { font-family: var(--font-display); font-size: 1.8rem; color: var(--text-primary); margin-bottom: 8px; }
  .center-msg .icon-big { font-size: 4rem; margin-bottom: 16px; }
  .center-msg .small-note {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 12px;
    font-family: var(--font-mono);
    background: rgba(255,255,255,0.05);
    padding: 6px 12px;
    border-radius: 6px;
  }
  .btn-primary {
    background: var(--accent-blue); border: none; color: white; padding: 10px 20px;
    border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 16px;
  }

  /* LAYAR BILLING (LOCK SCREEN) */
  .billing-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a0c 100%);
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  .billing-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .billing-icon {
    width: 130px; height: 130px;
    border-radius: 50%;
    background: rgba(239, 68, 68, 0.15);
    color: var(--accent-red);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4rem;
    margin-bottom: 30px;
    animation: pulseAlert 1.5s infinite;
  }
  .billing-icon.green {
    background: rgba(34, 197, 94, 0.15);
    color: var(--accent-green);
  }
  .billing-icon.gold {
    background: rgba(245, 158, 11, 0.15);
    color: var(--accent-gold);
  }
  @keyframes pulseAlert {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
    50% { transform: scale(1.05); box-shadow: 0 0 0 30px rgba(239, 68, 68, 0); }
  }

  .billing-title {
    font-family: var(--font-display);
    font-size: 3rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 16px;
    letter-spacing: -1px;
    line-height: 1.1;
  }
  .billing-title.green { color: var(--accent-green); }
  .billing-title.gold { color: var(--accent-gold); }

  .billing-subtitle {
    font-size: 1.2rem;
    color: var(--text-secondary);
    margin-bottom: 40px;
    max-width: 600px;
    line-height: 1.6;
  }

  .billing-info {
    display: flex;
    gap: 40px;
    background: rgba(255, 255, 255, 0.05);
    padding: 20px 40px;
    border-radius: 16px;
    border: 1px solid var(--border-color);
    margin-bottom: 30px;
  }
  .billing-info-item .lbl {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .billing-info-item .val {
    font-family: var(--font-mono);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-top: 4px;
  }

  .billing-warn {
    background: rgba(245, 158, 11, 0.1);
    border: 1px solid rgba(245, 158, 11, 0.3);
    color: var(--accent-gold);
    padding: 14px 28px;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 600px;
    line-height: 1.5;
  }
  .billing-warn i { font-size: 1.3rem; flex-shrink: 0; }
  .billing-warn.green {
    background: rgba(34, 197, 94, 0.1);
    border-color: rgba(34, 197, 94, 0.3);
    color: var(--accent-green);
  }

  .billing-watermark {
    position: absolute;
    top: 30px;
    left: 40px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .billing-watermark .logo {
    width: 40px; height: 40px;
    background: var(--accent-green);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #000; font-size: 1.2rem;
    font-family: var(--font-display);
  }
  .billing-watermark .text { text-align: left; }
  .billing-watermark .brand {
    font-family: var(--font-display);
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent-green);
  }
  .billing-watermark .sub {
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .billing-clock {
    position: absolute;
    bottom: 30px;
    right: 40px;
    text-align: right;
  }
  .billing-clock .time {
    font-family: var(--font-mono);
    font-size: 2rem;
    font-weight: 700;
    color: var(--text-secondary);
  }
  .billing-clock .date {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 4px;
  }
</style>
</head>
<body>

<!-- Force Modal Popup -->
<div class="force-modal-overlay" id="forceModalOverlay">
  <div class="force-modal" id="forceModal">
    <div class="modal-icon" id="forceModalIcon"><i class="bi bi-info-circle-fill"></i></div>
    <div class="modal-title" id="forceModalTitle">Notifikasi</div>
    <div class="modal-message" id="forceModalMessage"></div>
    <button class="modal-btn" onclick="closeForceModal()">
      <i class="bi bi-check-lg"></i> OK, Mengerti
    </button>
  </div>
</div>

<!-- ================= LAYAR BILLING (LOCK SCREEN) ================= -->
<div class="billing-overlay" id="billingOverlay">
  <div class="billing-watermark">
    <div class="logo">9</div>
    <div class="text">
      <div class="brand">Billing Perpus V.2</div>
      <div class="sub">SMKN 40 Jakarta</div>
    </div>
  </div>

  <div class="billing-icon" id="billingIcon">
    <i class="bi bi-hourglass-split" id="billingIconInner"></i>
  </div>

  <div class="billing-title" id="billingTitle">Waktu Habis</div>
  <div class="billing-subtitle" id="billingSubtitle">
    Sesi Anda telah berakhir. Silakan hubungi petugas untuk melanjutkan.
  </div>

  <div class="billing-info">
    <div class="billing-info-item">
      <div class="lbl">PC</div>
      <div class="val" id="billingPC">-</div>
    </div>
    <div class="billing-info-item">
      <div class="lbl">Pengguna</div>
      <div class="val" id="billingUser">-</div>
    </div>
    <div class="billing-info-item">
      <div class="lbl">Lokasi</div>
      <div class="val" id="billingLocation">-</div>
    </div>
  </div>

  <div class="billing-warn" id="billingWarn">
    <i class="bi bi-info-circle-fill"></i>
    <span id="billingWarnText">Menunggu petugas menambahkan waktu...</span>
  </div>

  <div class="billing-clock">
    <div class="time" id="billingClockTime">--:--</div>
    <div class="date" id="billingClockDate">--</div>
  </div>
</div>

<div id="root"></div>

<script>
  // ================= GUARD SOCKET.IO =================
  let socket;
  if (typeof io === 'undefined') {
    console.error('[FATAL] Socket.io gagal dimuat.');
    document.addEventListener('DOMContentLoaded', () => {
      const rootEl = document.getElementById('root');
      if (rootEl) {
        rootEl.innerHTML = `
          <div class="center-msg">
            <div class="icon-big">⚠️</div>
            <h1>Koneksi Gagal</h1>
            <p>Library <strong>Socket.io</strong> tidak dapat dimuat.</p>
            <button class="btn-primary" onclick="location.reload()">🔄 Coba Lagi</button>
          </div>`;
      }
    });
    socket = { connected: false, on: () => {}, emit: () => {}, disconnect: () => {} };
  } else {
    socket = io('/', { transports: ['websocket', 'polling'] });
  }

  const root = document.getElementById('root');

  let allPCs = [];
  let hasData = false;
  let myCode = new URLSearchParams(location.search).get('pc') || null;

  let lastKnownStatus = undefined;
  let lastKnownUserName = undefined;
  let lockScreenActive = false;

  console.log('[Init] PC Code dari URL:', myCode);

  // ================= LAYAR BILLING (LOCK SCREEN) =================
  function showBillingScreen(pc, mode) {
    mode = mode || 'idle';
    const overlay = document.getElementById('billingOverlay');
    const icon = document.getElementById('billingIcon');
    const iconInner = document.getElementById('billingIconInner');
    const title = document.getElementById('billingTitle');
    const subtitle = document.getElementById('billingSubtitle');
    const warn = document.getElementById('billingWarn');
    const warnText = document.getElementById('billingWarnText');

    icon.className = 'billing-icon';
    title.className = 'billing-title';
    warn.className = 'billing-warn';

    if (mode === 'idle') {
      icon.classList.add('green');
      iconInner.className = 'bi bi-pc-display';
      title.classList.add('green');
      title.innerText = 'PC Belum Aktif';
      subtitle.innerText = 'Silakan hubungi petugas perpustakaan untuk memulai sesi di unit ini.';
      warnText.innerText = 'Layar ini tidak dapat ditutup. Hubungi petugas untuk memulai.';
    } else {
      icon.classList.add('gold');
      iconInner.className = 'bi bi-hourglass-bottom';
      title.classList.add('gold');
      title.innerText = 'Waktu Habis';
      subtitle.innerText = 'Sesi Anda telah berakhir. Silakan hubungi petugas untuk melanjutkan.';
      warnText.innerText = 'Menunggu petugas menambahkan waktu...';
    }

    document.getElementById('billingPC').innerText = pc.code || '-';
    document.getElementById('billingUser').innerText = pc.user_name || lastKnownUserName || '-';
    document.getElementById('billingLocation').innerText = pc.location || '-';

    overlay.classList.add('show');
    lockScreenActive = true;
    updateBillingClock();
  }

  function hideBillingScreen() {
    const overlay = document.getElementById('billingOverlay');
    if (!overlay) return;
    overlay.classList.remove('show');
    lockScreenActive = false;
  }

  function updateBillingClock() {
    const now = new Date();
    const timeEl = document.getElementById('billingClockTime');
    const dateEl = document.getElementById('billingClockDate');
    if (timeEl) timeEl.innerText = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    if (dateEl) dateEl.innerText = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });
  }
  setInterval(updateBillingClock, 10000);

  // ================= LOCK SCREEN: CEGAH CLOSE =================
  window.addEventListener('beforeunload', (e) => {
    if (lockScreenActive) {
      e.preventDefault();
      e.returnValue = 'Layar terkunci. Hubungi petugas untuk membuka.';
      return e.returnValue;
    }
  });

  document.addEventListener('keydown', (e) => {
    if (!lockScreenActive) return;
    const key = e.key.toLowerCase();
    const ctrl = e.ctrlKey || e.metaKey;
    const alt = e.altKey;

    if (
      (ctrl && key === 'w') ||
      (ctrl && key === 'r') ||
      (ctrl && key === 't') ||
      (ctrl && key === 'n') ||
      (ctrl && e.shiftKey && key === 'w') ||
      (ctrl && e.shiftKey && key === 't') ||
      key === 'f5' ||
      key === 'f11' ||
      (alt && key === 'f4') ||
      key === 'escape' ||
      key === 'f12'
    ) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  }, true);

  document.addEventListener('contextmenu', (e) => {
    if (lockScreenActive) {
      e.preventDefault();
      return false;
    }
  }, true);

  // ================= NOTIFIKASI =================
  function playNotificationSound() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      oscillator.frequency.value = 880;
      oscillator.type = 'sine';
      gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      oscillator.start(audioCtx.currentTime);
      oscillator.stop(audioCtx.currentTime + 0.5);
    } catch (e) {}
  }

  function showForceModal(toast) {
    const iconMap = {
      'danger': 'bi-exclamation-triangle-fill',
      'success': 'bi-check-circle-fill',
      'warn': 'bi-pause-circle-fill',
      'info': 'bi-info-circle-fill'
    };
    document.getElementById('forceModalIcon').className = 'bi ' + (iconMap[toast.variant] || 'bi-info-circle-fill');
    document.getElementById('forceModalTitle').innerText = toast.title || 'Notifikasi';
    document.getElementById('forceModalMessage').innerText = toast.message || '';

    const modal = document.getElementById('forceModal');
    modal.className = 'force-modal ' + (toast.variant || 'info');

    document.getElementById('forceModalOverlay').classList.add('show');
    playNotificationSound();
  }

  function closeForceModal() {
    document.getElementById('forceModalOverlay').classList.remove('show');
  }

  function triggerNotification(toast) {
    playNotificationSound();
    showForceModal(toast);
  }

  // ================= SOCKET EVENTS =================
  socket.on('connect', () => { render(); });
  socket.on('disconnect', () => { render(); });
  socket.on('init_pcs', data => { allPCs = data || []; hasData = true; render(); });
  socket.on('update_pcs', data => { allPCs = data || []; hasData = true; render(); });

  function myPC() { return allPCs.find(p => p.code === myCode); }

  // ================= NOTIFIKASI DARI ADMIN =================

  // Chat dari admin (SUDAH ADA sebelumnya)
  socket.on('receive_admin_chat', data => {
    if (!data) return;
    const pc = myPC();
    if (!pc || String(data.pcId) !== String(pc.id)) return;
    triggerNotification({
      variant: 'info',
      title: '💬 PESAN DARI PETUGAS',
      message: data.message || ''
    });
  });

  // Admin menambah waktu
  socket.on('receive_time_extended', data => {
    if (!data) return;
    const pc = myPC();
    if (!pc || String(data.pcId) !== String(pc.id)) return;
    triggerNotification({
      variant: 'success',
      title: '⏱️ WAKTU DITAMBAH',
      message: `Petugas menambahkan ${data.addMinutes} menit ke sesi Anda.\nSisa waktu sekarang: ${data.formatted_time || '-'}`
    });
  });

  // Admin mengurangi waktu
  socket.on('receive_time_reduced', data => {
    if (!data) return;
    const pc = myPC();
    if (!pc || String(data.pcId) !== String(pc.id)) return;
    const reasonText = data.reason ? `\nAlasan: ${data.reason}` : '';
    triggerNotification({
      variant: 'warn',
      title: '⚠️ WAKTU DIKURANGI',
      message: `Petugas mengurangi ${data.reduceMinutes} menit dari sesi Anda.${reasonText}\nSisa waktu sekarang: ${data.formatted_time || '-'}`
    });
  });

  // Admin pause sesi
  socket.on('receive_paused', data => {
    if (!data) return;
    const pc = myPC();
    if (!pc || String(data.pcId) !== String(pc.id)) return;
    triggerNotification({
      variant: 'warn',
      title: '⏸️ SESI DIJEDA',
      message: 'Sesi Anda dijeda oleh petugas. Saldo waktu tidak berkurang. Hubungi petugas untuk melanjutkan.'
    });
  });

  // Admin resume sesi
  socket.on('receive_resumed', data => {
    if (!data) return;
    const pc = myPC();
    if (!pc || String(data.pcId) !== String(pc.id)) return;
    triggerNotification({
      variant: 'success',
      title: '▶️ SESI DILANJUTKAN',
      message: 'Sesi Anda dilanjutkan oleh petugas. Selamat menggunakan!'
    });
  });

  // Admin menutup sesi
  socket.on('receive_ended', data => {
    if (!data) return;
    const pc = myPC();
    if (!pc || String(data.pcId) !== String(pc.id)) return;
    triggerNotification({
      variant: 'danger',
      title: '🛑 SESI BERAKHIR',
      message: 'Sesi Anda telah diakhiri oleh petugas.'
    });
  });

  function fmtClock() {
    const d = new Date();
    return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  }
  function fmtDate() {
    const d = new Date();
    return d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  function parseServerTime(raw) {
    if (!raw) return '00:00:00';
    const parts = String(raw).split('.');
    if (parts.length !== 3) return String(raw);
    const [h, m, s] = parts;
    return `${h.padStart(2, '0')}:${m.padStart(2, '0')}:${s.padStart(2, '0')}`;
  }

  // ================= RENDER =================
  let lastRenderState = {
    status: null,
    duration: null,
    userName: null,
    sessionCount: null,
    saldo: null,
    location: null
  };

  function updateDynamicParts(pc) {
    const isSessionActive = pc.status === 'in-use' || pc.status === 'paused';
    const timerStr = isSessionActive ? parseServerTime(pc.formatted_time) : '--:--:--';

    const timerEl = document.querySelector('.timer-display');
    if (timerEl) {
      timerEl.innerText = timerStr;
      if (pc.status === 'paused') {
        timerEl.classList.add('dim');
      } else {
        timerEl.classList.remove('dim');
      }
    }
  }

  function renderError(message, detail) {
    root.innerHTML = `
      <div class="center-msg">
        <div class="icon-big">⚠️</div>
        <h1>${message}</h1>
        <p>${detail}</p>
        <p class="small-note">URL harus menyertakan <code>?pc=KODE_PC</code></p>
      </div>`;
  }

  function render() {
    if (!hasData) return renderLoading();

    if (!myCode) {
      return renderError(
        'Konfigurasi PC Kosong',
        'URL tidak menyertakan parameter <code>?pc=</code>. Contoh: <code>http://192.168.5.23:3000/user?pc=PC01</code>'
      );
    }

    const pc = allPCs.find(p => p.code === myCode);
    if (!pc) {
      return renderError(
        'PC Tidak Ditemukan',
        `Kode PC "<strong>${myCode}</strong>" tidak terdaftar di sistem. Hubungi petugas.`
      );
    }

    if (pc.status === 'in-use' || pc.status === 'paused') {
      if (lockScreenActive) hideBillingScreen();
    } else if (pc.status === 'available' || pc.status === 'maintenance') {
      const mode = 'idle';
      if (pc.user_name) lastKnownUserName = pc.user_name;
      showBillingScreen(pc, mode);
    }

    if (pc.user_name) lastKnownUserName = pc.user_name;

    const currentState = {
      status: pc.status,
      duration: pc.current_duration_minutes,
      userName: pc.user_name,
      sessionCount: pc.today_sessions,
      saldo: pc.saldo_hours,
      location: pc.location
    };

    const stateChanged =
      lastRenderState.status !== currentState.status ||
      lastRenderState.duration !== currentState.duration ||
      lastRenderState.userName !== currentState.userName ||
      lastRenderState.sessionCount !== currentState.sessionCount ||
      lastRenderState.saldo !== currentState.saldo ||
      lastRenderState.location !== currentState.location;

    if (!stateChanged && root.querySelector('.timer-display')) {
      updateDynamicParts(pc);
      return;
    }

    lastRenderState = Object.assign({}, currentState);

    const isSessionActive = pc.status === 'in-use' || pc.status === 'paused';
    const userName = isSessionActive ? (pc.user_name || '-') : '-';
    const sessionCount = pc.today_sessions || 0;
    let saldo = '-';
    if (isSessionActive && pc.saldo_hours && pc.saldo_hours !== '-') {
      saldo = pc.saldo_hours + ' Jam';
    }
    const timerStr = isSessionActive ? parseServerTime(pc.formatted_time) : '--:--:--';

    let centerContent = '';
    if (pc.status === 'available') {
      centerContent = `
        <div class="status-pill available"><span class="dot"></span>PC KOSONG</div>
        <div class="headline">Siap Digunakan</div>
        <div class="subline">Silakan hubungi petugas perpustakaan untuk memulai sesi di unit ini.</div>
      `;
    } else if (pc.status === 'maintenance') {
      centerContent = `
        <div class="status-pill maintenance"><span class="dot"></span>MAINTENANCE</div>
        <div class="headline">Sedang Dalam Perbaikan</div>
        <div class="subline">Mohon jangan menggunakan unit ini sampai perbaikan selesai.</div>
      `;
    } else if (pc.status === 'in-use') {
      centerContent = `
        <div class="status-pill inuse"><span class="dot"></span>SEDANG DIGUNAKAN</div>
        <div class="timer-display">${timerStr}</div>
        <div class="info-grid">
          <div class="info-item"><div class="lbl">PENGGUNA</div><div class="val">${userName}</div></div>
          <div class="info-item"><div class="lbl">SALDO WAKTU</div><div class="val">${saldo}</div></div>
          <div class="info-item"><div class="lbl">SESI KE</div><div class="val">${sessionCount} / 2</div></div>
        </div>
      `;
    } else if (pc.status === 'paused') {
      centerContent = `
        <div class="status-pill paused"><span class="dot"></span>SESI DIJEDA</div>
        <div class="timer-display dim">${timerStr}</div>
        <div class="subline" style="margin-top:-8px;">Sesi dijeda oleh petugas. Saldo waktu tidak berkurang.</div>
        <div class="info-grid">
          <div class="info-item"><div class="lbl">PENGGUNA</div><div class="val">${userName}</div></div>
          <div class="info-item"><div class="lbl">SALDO WAKTU</div><div class="val">${saldo}</div></div>
          <div class="info-item"><div class="lbl">SESI KE</div><div class="val">${sessionCount} / 2</div></div>
        </div>
      `;
    }

    root.innerHTML = `
      <div style="display:flex; flex-direction:column; height:100vh;">
        <div class="header">
          <div class="header-left">
            <div class="logo-box">9</div>
            <div>
              <div class="brand-text">Biling V.2</div>
              <div class="brand-sub">Jl. Cikini Raya No. 73, Cikini, Kecamatan Menteng, Jakarta Pusat</div>
            </div>
          </div>
          <div class="header-right">
            <div class="status-badge ${socket.connected ? '' : 'off'}">
              <span class="dot"></span> ${socket.connected ? 'Connected' : 'Disconnected'}
            </div>
            <div>
              <div class="clock-display">${fmtClock()}</div>
              <div class="date-display">${fmtDate()}</div>
            </div>
          </div>
        </div>

        <div class="main-body">
          <div class="sidebar">
            <div class="panel-box">
              <div class="panel-title">Status Sesi</div>
              <div class="info-row"><span class="label">PC</span><span class="value">${pc.code}</span></div>
              <div class="info-row"><span class="label">Lokasi</span><span class="value">${pc.location || '-'}</span></div>
              <div class="info-row"><span class="label">Status</span><span class="value">${pc.status}</span></div>
            </div>

            ${isSessionActive ? `
            <div class="panel-box">
              <div class="panel-title">Detail Pengguna</div>
              <div class="info-row"><span class="label">Nama</span><span class="value highlight">${userName}</span></div>
              <div class="info-row"><span class="label">Saldo</span><span class="value">${saldo}</span></div>
              <div class="info-row"><span class="label">Sesi Ke</span><span class="value">${sessionCount} / 2</span></div>
            </div>
            ` : ''}

            <div style="text-align:center; font-size:0.65rem; color:var(--text-muted); margin-top:auto;">
              Maks. 2x pakai / user / hari
            </div>
          </div>

          <div class="main-content">
            <div class="content-wrapper">
              <div class="status-card">${centerContent}</div>
              <div class="bottom-cards">
                <div class="info-card">
                  <div class="icon"><i class="bi bi-info-circle-fill"></i></div>
                  <div class="text"><h4>Informasi</h4><p>Gunakan waktu Anda dengan bijak.</p></div>
                </div>
                <div class="info-card">
                  <div class="icon" style="background:rgba(245,158,11,0.1); color:var(--accent-gold);"><i class="bi bi-exclamation-triangle-fill"></i></div>
                  <div class="text"><h4>Peringatan</h4><p>Jangan tinggalkan komputer tanpa pengawasan.</p></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="footer">
          <div class="footer-left">
            <span>Biling V.2</span>
            <span style="color:var(--text-muted);">|</span>
            <span>WEBSITE INI DIBUAT OLEH SISWA SMKN40 JAKARTA</span>
          </div>
        </div>
      </div>
    `;
  }

  function renderLoading() {
    root.innerHTML = `<div class="center-msg"><h1>Menghubungkan…</h1><p>Mengambil data unit PC dari server.</p></div>`;
  }

  render();
</script>
</body>
</html>
