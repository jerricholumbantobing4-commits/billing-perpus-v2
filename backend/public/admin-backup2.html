<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing Perpus — Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<style>
    :root {
    --bg: #eef2f7;
    --surface: #ffffff;
    --surface-hover: #f8fafc;
    --border: #dde3ea;
    --border-strong: #b8c2cf;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #8896a8;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --success: #16a34a;
    --success-soft: #dcfce7;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --warning: #ea8c00;
    --warning-soft: #ffedd5;
    --info: #0891b2;
    --info-soft: #cffafe;
    --radius: 10px;
    --radius-sm: 6px;
    --font-body: 'Inter', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  /* ================= SIDEBAR ================= */
  .sidebar {
    width: 240px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    min-height: 100vh;
    position: fixed;
    top: 0; left: 0;
    display: flex;
    flex-direction: column;
    z-index: 100;
    transition: width 0.2s ease;
  }
  .sidebar.collapsed { width: 64px; }
  .sidebar.collapsed .nav-label,
  .sidebar.collapsed .brand-text,
  .sidebar.collapsed .sidebar-foot { display: none; }

  .sidebar-brand {
    padding: 20px 20px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    min-height: 64px;
  }
  .brand-mark {
    width: 32px; height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    flex-shrink: 0;
  }
  .brand-text { line-height: 1.2; }
  .brand-text .name {
    font-weight: 700;
    font-size: 14px;
    color: var(--text-primary);
  }
  .brand-text .sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 1px;
  }

  .sidebar-nav {
    flex: 1;
    padding: 12px 8px;
    overflow-y: auto;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    margin-bottom: 2px;
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
  }
  .nav-item:hover {
    background: var(--surface-hover);
    color: var(--text-primary);
  }
  .nav-item.active {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .nav-item i {
    font-size: 16px;
    width: 20px;
    text-align: center;
    flex-shrink: 0;
  }
  .nav-label { white-space: nowrap; }

  .sidebar-foot {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-muted);
  }

  /* ================= MAIN ================= */
  .main {
    margin-left: 240px;
    padding: 24px 32px 60px;
    transition: margin-left 0.2s ease;
    min-height: 100vh;
  }
  .sidebar.collapsed ~ .main { margin-left: 64px; }

  /* ================= TOPBAR ================= */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .topbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn-icon {
    background: var(--surface);
    border: 1px solid var(--border);
    width: 36px; height: 36px;
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    font-size: 16px;
  }
  .btn-icon:hover {
    background: var(--surface-hover);
    color: var(--text-primary);
    border-color: var(--border-strong);
  }

  .page-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
    margin: 0;
  }
  .page-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* ================= BUTTONS ================= */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    text-decoration: none;
  }
  .btn:hover {
    background: var(--surface-hover);
    border-color: var(--border-strong);
  }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn-primary:hover {
    background: #425a75;
    border-color: #425a75;
    color: #fff;
  }
  .btn-success {
    background: var(--success);
    border-color: var(--success);
    color: #fff;
  }
  .btn-success:hover {
    background: #5a8568;
    border-color: #5a8568;
  }
  .btn-danger {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }
  .btn-danger:hover {
    background: #b56565;
    border-color: #b56565;
  }
  .btn-warning {
    background: var(--warning);
    border-color: var(--warning);
    color: #fff;
  }
  .btn-sm {
    padding: 6px 10px;
    font-size: 12px;
  }

  /* ================= STATS ================= */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .stat-icon {
    width: 40px; height: 40px;
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .stat-icon.neutral { background: var(--accent-soft); color: var(--accent); }
  .stat-icon.success { background: var(--success-soft); color: var(--success); }
  .stat-icon.danger { background: var(--danger-soft); color: var(--danger); }
  .stat-icon.warning { background: var(--warning-soft); color: var(--warning); }
  .stat-num {
    font-size: 22px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1;
    font-family: var(--font-mono);
  }
  .stat-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 500;
  }

  /* ================= TOOLBAR ================= */
  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-box {
    flex: 1;
    min-width: 200px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 8px 12px 8px 34px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-box input:focus {
    border-color: var(--accent);
  }
  .search-box i {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 14px;
  }

  .filter-btn {
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn:hover {
    border-color: var(--border-strong);
    color: var(--text-primary);
  }
  .filter-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ================= PC GRID ================= */
  .pc-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
  }

  .pc-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    display: flex;
    flex-direction: column;
    transition: all 0.15s;
    position: relative;
  }
  .pc-card:hover {
    border-color: var(--border-strong);
    box-shadow: 0 2px 8px rgba(31, 41, 55, 0.04);
  }

  /* Status strip di kiri */
  .pc-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 12px;
    bottom: 12px;
    width: 3px;
    border-radius: 0 2px 2px 0;
  }
  .pc-card.available::before { background: var(--success); }
  .pc-card.in-use::before { background: var(--danger); }
  .pc-card.paused::before { background: var(--warning); }
  .pc-card.maintenance::before { background: var(--info); }

  .pc-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .pc-code {
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
  }
  .pc-loc {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .pc-status {
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .pc-status.available { background: var(--success-soft); color: var(--success); }
  .pc-status.in-use { background: var(--danger-soft); color: var(--danger); }
  .pc-status.paused { background: var(--warning-soft); color: var(--warning); }
  .pc-status.maintenance { background: var(--info-soft); color: var(--info); }

  .pc-info {
    background: var(--bg);
    border-radius: var(--radius-sm);
    padding: 10px;
    margin-bottom: 12px;
    font-size: 12px;
  }
  .pc-info-row {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
    color: var(--text-secondary);
  }
  .pc-info-row:not(:last-child) {
    border-bottom: 1px dashed var(--border);
  }
  .pc-info-row .label {
    color: var(--text-muted);
    font-size: 11px;
  }
  .pc-info-row .value {
    font-weight: 600;
    color: var(--text-primary);
  }
  .pc-info-row .value.mono {
    font-family: var(--font-mono);
  }

  .pc-timer {
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    color: var(--text-primary);
    padding: 8px 0;
    margin-bottom: 10px;
    letter-spacing: -0.5px;
  }
  .pc-timer.idle {
    color: var(--text-muted);
    font-size: 16px;
  }

  .pc-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: auto;
  }
  .pc-actions .btn {
    flex: 1 1 auto;
    min-width: 0;
    padding: 6px 8px;
    font-size: 11px;
  }
  .pc-actions .btn-icon-only {
    flex: 0 0 auto;
    padding: 6px 10px;
  }

  /* ================= PAGINATION ================= */
  .pagination-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-muted);
  }
  .pagination {
    display: flex;
    gap: 4px;
  }
  .pagination button {
    min-width: 32px;
    height: 32px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font-body);
  }
  .pagination button:hover:not(:disabled) {
    background: var(--surface-hover);
    color: var(--text-primary);
  }
  .pagination button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .pagination button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* ================= EMPTY STATE ================= */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius);
  }
  .empty-state i {
    font-size: 40px;
    color: var(--text-muted);
    opacity: 0.5;
    display: block;
    margin-bottom: 12px;
  }
  .empty-state p {
    margin: 0;
    font-size: 13px;
  }

  /* ================= MODALS ================= */
  .modal-content {
    border: none;
    border-radius: var(--radius);
    box-shadow: 0 20px 60px rgba(31, 41, 55, 0.15);
  }
  .modal-header {
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
  }
  .modal-title {
    font-size: 15px;
    font-weight: 700;
  }
  .modal-body { padding: 20px; }
  .modal-footer {
    border-top: 1px solid var(--border);
    padding: 12px 20px;
  }

  .form-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 4px;
    display: block;
  }
  .form-control, .form-select {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
  }
  .form-control:focus, .form-select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  /* ================= RESPONSIVE ================= */
  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.mobile-open { transform: translateX(0); }
    .main { margin-left: 0; padding: 16px; }
    .sidebar.collapsed ~ .main { margin-left: 0; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }

  /* Sidebar backdrop */
  .sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(31, 41, 55, 0.3);
    z-index: 99;
  }
  .sidebar-backdrop.show { display: block; }
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-mark">B</div>
    <div class="brand-text">
      <div class="name">Billing Perpus</div>
      <div class="sub">Monitoring</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a class="nav-item active" data-page="monitoring">
      <i class="bi bi-grid-1x2"></i>
      <span class="nav-label">Monitoring PC</span>
    </a>
    <a class="nav-item" data-page="queue">
      <i class="bi bi-hourglass-split"></i>
      <span class="nav-label">Antrean</span>
    </a>
    <a class="nav-item" data-page="users">
      <i class="bi bi-people"></i>
      <span class="nav-label">Kelola User</span>
    </a>
    <a class="nav-item" data-page="history">
      <i class="bi bi-clock-history"></i>
      <span class="nav-label">Riwayat Sesi</span>
    </a>
    <a class="nav-item" data-page="settings">
      <i class="bi bi-gear"></i>
      <span class="nav-label">Pengaturan</span>
    </a>
  </nav>

  <div class="sidebar-foot">
    <i class="bi bi-shield-check me-1"></i>
    V.2.0 — SMKN 40
  </div>
</aside>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<!-- Main Content -->
<main class="main" id="main">

  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-left">
      <button class="btn-icon d-md-none" onclick="toggleSidebar()">
        <i class="bi bi-list"></i>
      </button>
      <div>
        <h1 class="page-title" id="pageTitle">Dashboard Monitoring</h1>
        <div class="page-sub" id="pageSub">Pantau status unit PC secara real-time</div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="btn" onclick="resetAllQuotas()">
        <i class="bi bi-arrow-clockwise"></i> Reset Kuota
      </button>
      <button class="btn-icon">
        <i class="bi bi-bell"></i>
      </button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon neutral"><i class="bi bi-pc-display"></i></div>
      <div>
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">Total Unit</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon success"><i class="bi bi-check-circle"></i></div>
      <div>
        <div class="stat-num" id="statAvailable">0</div>
        <div class="stat-label">Kosong</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon danger"><i class="bi bi-person-fill"></i></div>
      <div>
        <div class="stat-num" id="statInUse">0</div>
        <div class="stat-label">Dipakai</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon warning"><i class="bi bi-pause-circle"></i></div>
      <div>
        <div class="stat-num" id="statPaused">0</div>
        <div class="stat-label">Jeda / Maintenance</div>
      </div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-box">
      <i class="bi bi-search"></i>
      <input type="text" id="searchInput" placeholder="Cari kode PC atau nama user..." oninput="applyFilter()">
    </div>
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">Semua</button>
    <button class="filter-btn" data-filter="available" onclick="setFilter('available', this)">Kosong</button>
    <button class="filter-btn" data-filter="in-use" onclick="setFilter('in-use', this)">Dipakai</button>
    <button class="filter-btn" data-filter="paused" onclick="setFilter('paused', this)">Jeda</button>
    <button class="btn btn-primary" onclick="openAddPCModal()">
      <i class="bi bi-plus-lg"></i> Tambah PC
    </button>
  </div>

  <!-- PC Grid -->
  <div class="pc-grid" id="pcGrid"></div>

  <!-- Pagination -->
  <div class="pagination-bar" id="paginationBar"></div>
</main>

<!-- ================= MODALS ================= -->

<!-- Modal Start Session -->
<div class="modal fade" id="startModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Mulai Sesi</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="modalPcId">
        <div class="mb-3">
          <label class="form-label">Nama Pengguna</label>
          <input type="text" id="modalUserName" class="form-control" placeholder="Masukkan nama...">
        </div>
        <div class="mb-3">
          <label class="form-label">Jenis Pengguna</label>
          <select id="modalPurpose" class="form-select">
            <option value="kawan perpus">Kawan Perpus</option>
            <option value="kawan perpus nambah">Kawan Perpus Nambah</option>
            <option value="tambah 5 menit">Tambah 5 Menit</option>
          </select>
        </div>
        <div class="mb-1">
          <label class="form-label">Durasi (Menit)</label>
          <input type="number" id="modalDuration" class="form-control" placeholder="Default: 60" min="1">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" data-bs-dismiss="modal">Batal</button>
        <button class="btn btn-success" onclick="submitStartSession()">
          <i class="bi bi-play-fill"></i> Mulai Sesi
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Tambah PC -->
<div class="modal fade" id="addPCModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Tambah Unit PC</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Kode PC</label>
          <input type="text" id="addPCCode" class="form-control" placeholder="Contoh: PC-01">
        </div>
        <div class="mb-1">
          <label class="form-label">Lokasi</label>
          <input type="text" id="addPCLocation" class="form-control" placeholder="Contoh: Lantai 7">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" data-bs-dismiss="modal">Batal</button>
        <button class="btn btn-primary" onclick="submitAddPC()">
          <i class="bi bi-plus-lg"></i> Tambah
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Waktu -->
<div class="modal fade" id="extendModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="extendModalTitle">Tambah Waktu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="extendPcId">
        <label class="form-label">Pilih Durasi</label>
        <select id="extendMinutes" class="form-select">
          <option value="5">+5 Menit</option>
          <option value="15">+15 Menit</option>
          <option value="30" selected>+30 Menit</option>
          <option value="60">+1 Jam</option>
          <option value="120">+2 Jam</option>
        </select>
      </div>
      <div class="modal-footer">
        <button class="btn" data-bs-dismiss="modal">Batal</button>
        <button class="btn btn-primary" onclick="submitExtend()">
          <i class="bi bi-plus-lg"></i> Tambah Waktu
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Pindah PC -->
<div class="modal fade" id="moveModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="moveModalTitle">Pindah PC</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="moveFromPcId">
        <label class="form-label">Pindah ke PC</label>
        <select id="moveTargetPc" class="form-select"></select>
      </div>
      <div class="modal-footer">
        <button class="btn" data-bs-dismiss="modal">Batal</button>
        <button class="btn btn-primary" onclick="submitMove()">
          <i class="bi bi-arrow-left-right"></i> Pindahkan
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Chat -->
<div class="modal fade" id="chatModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="chatModalTitle">Pesan ke User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="chatPcId">
        <label class="form-label">Pesan</label>
        <textarea id="chatMessage" class="form-control" rows="3" placeholder="Tulis pesan untuk user..."></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn" data-bs-dismiss="modal">Tutup</button>
        <button class="btn btn-primary" onclick="submitChat()">
          <i class="bi bi-send"></i> Kirim
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const socket = io('/', { transports: ['websocket', 'polling'] });

  let allPCs = [];
  let filteredPCs = [];
  let currentFilter = 'all';
  let currentPage = 1;
  const PER_PAGE = 12;

  const startModal = new bootstrap.Modal(document.getElementById('startModal'));
  const addPCModal = new bootstrap.Modal(document.getElementById('addPCModal'));
  const extendModal = new bootstrap.Modal(document.getElementById('extendModal'));
  const moveModal = new bootstrap.Modal(document.getElementById('moveModal'));
  const chatModal = new bootstrap.Modal(document.getElementById('chatModal'));

  // ================= SOCKET =================
  socket.on('connect', () => console.log('Connected:', socket.id));

  socket.on('init_pcs', (data) => {
    allPCs = data || [];
    applyFilter();
    updateStats();
  });

  socket.on('update_pcs', (data) => {
    allPCs = data || [];
    applyFilter();
    updateStats();
  });

  // ================= RENDER =================
  function applyFilter() {
    const search = (document.getElementById('searchInput')?.value || '').toLowerCase();

    filteredPCs = allPCs.filter(pc => {
      // Filter status
      if (currentFilter !== 'all' && pc.status !== currentFilter) return false;

      // Filter search
      if (search) {
        const code = (pc.code || '').toLowerCase();
        const user = (pc.user_name || '').toLowerCase();
        if (!code.includes(search) && !user.includes(search)) return false;
      }

      return true;
    });

    currentPage = 1;
    renderGrid();
  }

  function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilter();
  }

  function updateStats() {
    const total = allPCs.length;
    const available = allPCs.filter(p => p.status === 'available').length;
    const inUse = allPCs.filter(p => p.status === 'in-use').length;
    const paused = allPCs.filter(p => p.status === 'paused' || p.status === 'maintenance').length;

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statAvailable').textContent = available;
    document.getElementById('statInUse').textContent = inUse;
    document.getElementById('statPaused').textContent = paused;
  }

  function renderGrid() {
    const grid = document.getElementById('pcGrid');
    const total = filteredPCs.length;

    if (total === 0) {
      grid.innerHTML = `
        <div class="empty-state" style="grid-column: 1/-1;">
          <i class="bi bi-inbox"></i>
          <p>Belum ada PC. Klik "Tambah PC" untuk menambahkan.</p>
        </div>`;
      document.getElementById('paginationBar').innerHTML = '';
      return;
    }

    const startIdx = (currentPage - 1) * PER_PAGE;
    const endIdx = startIdx + PER_PAGE;
    const pageItems = filteredPCs.slice(startIdx, endIdx);

    grid.innerHTML = pageItems.map(pc => renderCard(pc)).join('');
    renderPagination(total);
  }

  function renderCard(pc) {
    const statusKey = pc.status; // 'available', 'in-use', 'paused', 'maintenance'
    const statusText = {
      'available': 'Kosong',
      'in-use': 'Dipakai',
      'paused': 'Jeda',
      'maintenance': 'Maintenance'
    }[statusKey] || 'Kosong';

    const isActive = pc.status === 'in-use' || pc.status === 'paused';
    const userName = isActive ? (pc.user_name || '-') : '-';
    const saldo = isActive && pc.saldo_hours && pc.saldo_hours !== '-'
      ? pc.saldo_hours + ' Jam' : '-';
    const sessionCount = pc.today_sessions || 0;
    const timer = isActive ? (pc.formatted_time || '--:--:--').replace(/\./g, ':') : '--:--:--';

    let actions = '';
    if (pc.status === 'available') {
      actions = `
        <button class="btn btn-success btn-sm" onclick="openStartModal(${pc.id}, '${pc.code}')">
          <i class="bi bi-play-fill"></i> Mulai
        </button>
        <button class="btn btn-sm btn-icon-only" onclick="setMaintenance(${pc.id}, 'maintenance')" title="Maintenance">
          <i class="bi bi-tools"></i>
        </button>
        <button class="btn btn-sm btn-icon-only" onclick="deletePC(${pc.id}, '${pc.code}')" title="Hapus">
          <i class="bi bi-trash"></i>
        </button>
      `;
    } else if (pc.status === 'in-use') {
      actions = `
        <button class="btn btn-warning btn-sm" onclick="pauseSession(${pc.id})">
          <i class="bi bi-pause-fill"></i> Jeda
        </button>
        <button class="btn btn-sm" onclick="openExtendModal(${pc.id}, '${userName}')">
          <i class="bi bi-plus-lg"></i> Waktu
        </button>
        <button class="btn btn-sm" onclick="openMoveModal(${pc.id}, '${userName}')">
          <i class="bi bi-arrow-left-right"></i> Pindah
        </button>
        <button class="btn btn-sm" onclick="reduceTime(${pc.id}, 15)">-15m</button>
        <button class="btn btn-sm btn-icon-only" onclick="openChatModal(${pc.id}, '${userName}')" title="Chat">
          <i class="bi bi-chat-dots"></i>
        </button>
        <button class="btn btn-danger btn-sm" onclick="endSession(${pc.id})">
          <i class="bi bi-stop-fill"></i> Selesai
        </button>
      `;
    } else if (pc.status === 'paused') {
      actions = `
        <button class="btn btn-primary btn-sm" onclick="resumeSession(${pc.id})">
          <i class="bi bi-play-fill"></i> Lanjut
        </button>
        <button class="btn btn-sm" onclick="openMoveModal(${pc.id}, '${userName}')">
          <i class="bi bi-arrow-left-right"></i> Pindah
        </button>
        <button class="btn btn-sm btn-icon-only" onclick="openChatModal(${pc.id}, '${userName}')" title="Chat">
          <i class="bi bi-chat-dots"></i>
        </button>
        <button class="btn btn-danger btn-sm" onclick="endSession(${pc.id})">
          <i class="bi bi-stop-fill"></i> Selesai
        </button>
      `;
    } else if (pc.status === 'maintenance') {
      actions = `
        <button class="btn btn-success btn-sm" onclick="setMaintenance(${pc.id}, 'available')">
          <i class="bi bi-check-lg"></i> Aktifkan
        </button>
        <button class="btn btn-sm btn-icon-only" onclick="deletePC(${pc.id}, '${pc.code}')" title="Hapus">
          <i class="bi bi-trash"></i>
        </button>
      `;
    }

    return `
      <div class="pc-card ${statusKey}">
        <div class="pc-header">
          <div>
            <div class="pc-code">${pc.code}</div>
            <div class="pc-loc"><i class="bi bi-geo-alt"></i> ${pc.location || '-'}</div>
          </div>
          <span class="pc-status ${statusKey}">${statusText}</span>
        </div>

        <div class="pc-info">
          <div class="pc-info-row">
            <span class="label">Pengguna</span>
            <span class="value">${userName}</span>
          </div>
          <div class="pc-info-row">
            <span class="label">Sesi Hari Ini</span>
            <span class="value mono">${sessionCount}</span>
          </div>
          <div class="pc-info-row">
            <span class="label">Saldo</span>
            <span class="value mono">${saldo}</span>
          </div>
        </div>

        <div class="pc-timer ${isActive ? '' : 'idle'}">${timer}</div>

        <div class="pc-actions">${actions}</div>
      </div>
    `;
  }

  function renderPagination(total) {
    const totalPages = Math.ceil(total / PER_PAGE);
    const bar = document.getElementById('paginationBar');

    if (totalPages <= 1) {
      bar.innerHTML = `<span>Menampilkan ${total} PC</span>`;
      return;
    }

    let pages = '';
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
        pages += `<button class="${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
      } else if (i === currentPage - 2 || i === currentPage + 2) {
        pages += `<button disabled>...</button>`;
      }
    }

    bar.innerHTML = `
      <span>Menampilkan ${(currentPage - 1) * PER_PAGE + 1}-${Math.min(currentPage * PER_PAGE, total)} dari ${total} PC</span>
      <div class="pagination">
        <button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
          <i class="bi bi-chevron-left"></i>
        </button>
        ${pages}
        <button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
          <i class="bi bi-chevron-right"></i>
        </button>
      </div>
    `;
  }

  function goToPage(page) {
    currentPage = page;
    renderGrid();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ================= ACTIONS =================
  function openStartModal(pcId, pcCode) {
    document.getElementById('modalPcId').value = pcId;
    document.getElementById('modalUserName').value = '';
    document.getElementById('modalDuration').value = '';
    startModal.show();
  }

  function submitStartSession() {
    const pcId = document.getElementById('modalPcId').value;
    const userName = document.getElementById('modalUserName').value.trim();
    const purpose = document.getElementById('modalPurpose').value;
    const duration = parseInt(document.getElementById('modalDuration').value) || 60;

    if (!userName) return alert('Nama wajib diisi');

    socket.emit('start_session', { pcId, userName, purpose, durationMinutes: duration }, (res) => {
      if (res?.error) alert('Gagal: ' + res.error);
      else {
        startModal.hide();
        console.log('✅ Sesi dimulai');
      }
    });
  }

  function endSession(pcId) {
    if (!confirm('Akhiri sesi ini?')) return;
    socket.emit('end_session', { pcId }, (res) => {
      if (res?.error) alert('Gagal: ' + res.error);
    });
  }

  function pauseSession(pcId) {
    socket.emit('pause_session', { pcId }, (res) => {
      if (res?.error) alert('Gagal Jeda: ' + res.error);
    });
  }

  function resumeSession(pcId) {
    socket.emit('resume_session', { pcId }, (res) => {
      if (res?.error) alert('Gagal Lanjut: ' + res.error);
    });
  }

  function reduceTime(pcId, minutes) {
    const reason = prompt(`Kurangi ${minutes} menit karena alasan apa?`, 'Mengganggu kenyamanan');
    if (reason !== null) {
      socket.emit('reduce_time', { pcId, reduceMinutes: minutes, reason }, (res) => {
        if (res?.error) alert('Gagal: ' + res.error);
      });
    }
  }

  function openExtendModal(pcId, userName) {
    document.getElementById('extendPcId').value = pcId;
    document.getElementById('extendModalTitle').textContent = `Tambah Waktu — ${userName}`;
    extendModal.show();
  }

  function submitExtend() {
    const pcId = document.getElementById('extendPcId').value;
    const addMinutes = parseInt(document.getElementById('extendMinutes').value);
    socket.emit('extend_time', { pcId, addMinutes }, (res) => {
      if (res?.error) alert('Gagal: ' + res.error);
      else extendModal.hide();
    });
  }

  function openMoveModal(pcId, userName) {
    document.getElementById('moveFromPcId').value = pcId;
    document.getElementById('moveModalTitle').textContent = `Pindah PC — ${userName}`;

    const available = allPCs.filter(p => p.status === 'available' && p.id !== pcId);
    const select = document.getElementById('moveTargetPc');
    select.innerHTML = available.length
      ? available.map(p => `<option value="${p.id}">${p.code} — ${p.location || '-'}</option>`).join('')
      : '<option value="">Tidak ada PC kosong</option>';

    moveModal.show();
  }

  function submitMove() {
    const fromPcId = document.getElementById('moveFromPcId').value;
    const toPcId = document.getElementById('moveTargetPc').value;
    if (!toPcId) return alert('Pilih PC tujuan');

    socket.emit('move_session', { fromPcId, toPcId }, (res) => {
      if (res?.error) alert('Gagal: ' + res.error);
      else {
        alert(res?.message || 'Berhasil dipindah');
        moveModal.hide();
      }
    });
  }

  function openChatModal(pcId, userName) {
    document.getElementById('chatPcId').value = pcId;
    document.getElementById('chatModalTitle').textContent = `Pesan ke ${userName}`;
    document.getElementById('chatMessage').value = '';
    chatModal.show();
  }

  function submitChat() {
    const pcId = document.getElementById('chatPcId').value;
    const message = document.getElementById('chatMessage').value.trim();
    if (!message) return alert('Pesan kosong');
    socket.emit('admin_send_chat', { pcId, message }, (res) => {
      if (res?.error) alert('Gagal: ' + res.error);
      else chatModal.hide();
    });
  }

  function setMaintenance(pcId, status) {
    socket.emit('set_pc_maintenance', { pcId, status }, () => {});
  }

  function deletePC(pcId, code) {
    if (!confirm(`Hapus ${code}?`)) return;
    socket.emit('delete_pc', { pcId }, () => {});
  }

  function openAddPCModal() {
    document.getElementById('addPCCode').value = '';
    document.getElementById('addPCLocation').value = '';
    addPCModal.show();
  }

  function submitAddPC() {
    const code = document.getElementById('addPCCode').value.trim();
    const location = document.getElementById('addPCLocation').value.trim();
    if (!code) return alert('Kode wajib diisi');

    socket.emit('add_pc', { code, location }, () => {
      addPCModal.hide();
    });
  }

  function resetAllQuotas() {
    if (!confirm('Reset semua kuota harian user?')) return;
    socket.emit('reset_all_daily_quotas', {}, (res) => {
      alert(res?.message || 'Done');
    });
  }

  // ================= SIDEBAR =================
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('mobile-open');
    document.getElementById('sidebarBackdrop').classList.toggle('show');
  }

  document.getElementById('sidebarBackdrop')?.addEventListener('click', toggleSidebar);

  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', function() {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      this.classList.add('active');

      const page = this.dataset.page;
      const titles = {
        monitoring: ['Dashboard Monitoring', 'Pantau status unit PC secara real-time'],
        queue: ['Antrean', 'Kelola antrean pengguna'],
        users: ['Kelola User', 'CRUD user dan kuota'],
        history: ['Riwayat Sesi', 'History 100 sesi terakhir'],
        settings: ['Pengaturan', 'Konfigurasi sistem']
      };
      const t = titles[page] || ['Dashboard', ''];
      document.getElementById('pageTitle').textContent = t[0];
      document.getElementById('pageSub').textContent = t[1];
    });
  });

  // Init
  applyFilter();
</script>

</body>
</html>
